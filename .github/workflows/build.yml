name: Build APK — Valente OS Terminal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # permite rodar manualmente pelo botão no GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v2

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v3
        with:
          name: ValenteOS-Terminal-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
