name: Build APK — Valente OS Terminal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.1'

      - name: Corrigir Build Tools (dx ausente nas versoes recentes)
        run: |
          for DIR in $ANDROID_HOME/build-tools/*/; do
            if [ -f "${DIR}d8" ] && [ ! -f "${DIR}dx" ]; then
              echo "Criando dx -> d8 em ${DIR}"
              ln -sf "${DIR}d8" "${DIR}dx"
            fi
          done
          echo "Build tools disponiveis:"
          ls $ANDROID_HOME/build-tools/

      - name: Build APK
        run: gradle assembleRelease
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ValenteOS-Terminal-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
