name: Build APK — Valente OS Terminal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.1'

      - name: Corrigir Build Tools (dx ausente nas versoes recentes)
        run: |
          for DIR in $ANDROID_HOME/build-tools/*/; do
            if [ -f "${DIR}d8" ] && [ ! -f "${DIR}dx" ]; then
              echo "Criando dx -> d8 em ${DIR}"
              ln -sf "${DIR}d8" "${DIR}dx"
            fi
          done
          echo "Build tools disponiveis:"
          ls $ANDROID_HOME/build-tools/

      - name: Chave de assinatura fixa
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE_B64 ausente. Build interrompido para nao gerar uma chave diferente da instalada."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          ACTUAL_CERT=$(keytool -exportcert -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f 1)
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "A assinatura configurada nao corresponde ao p17.apk dos Positivo. Build interrompido."
            exit 1
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          EXPECTED_CERT_SHA256: 9c6c9b62484fc2aac440b4106857eabb680991db87f3ecde55f29ea3112ce924

      - name: Build APK
        run: gradle assembleRelease
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Preparar p21.apk
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/release/app-release.apk entrega/p21.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ValenteOS-Terminal-p21
          path: entrega/p21.apk
          retention-days: 30
