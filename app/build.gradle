apply plugin: 'com.android.application'

android {
    namespace 'com.valenteartes.terminal'
    compileSdk 34

    defaultConfig {
        applicationId "com.valenteartes.terminal"
        minSdk 14
        targetSdk 21
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
