apply plugin: 'com.android.application'

android {
    namespace 'com.valenteartes.terminal'
    compileSdk 34

    defaultConfig {
        applicationId "com.valenteartes.terminal"
        minSdk 14
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        abortOnError false
    }

    packagingOptions {
        pickFirst '**/*.so'
    }
}

dependencies {
    // Conscrypt: TLS 1.2 no Android 4.x
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    // OkHttp 3.12: ultimo a suportar Android API 14+, suporta PATCH nativo
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
