apply plugin: 'com.android.application'

android {
    namespace 'com.valenteartes.terminal'
    compileSdk 34

    defaultConfig {
        applicationId "com.valenteartes.terminal"
        minSdk 14
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        abortOnError false
    }

    // Incluir .so do Conscrypt para ARM (tablets MEC AML8726-M)
    packagingOptions {
        pickFirst '**/*.so'
    }
}

dependencies {
    // Conscrypt: adiciona TLS 1.2 no Android 4.x sem Google Play Services
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
